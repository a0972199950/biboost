<!DOCTYPE html>
<!-- Google 登入的回跳頁：api.biboost.app 的登入中間頁導到這裡（?code&state，見 cloud.js 的 finishLogin），
     manifest 的 web_accessible_resources 只開給 api.biboost.app／api-staging.biboost.app。
     從歡迎頁登入的換完 token 直接換回歡迎頁；從 popup 登入的（小視窗）顯示雲端備份面板。版面跟歡迎頁一樣（白色頁首＋粉紅線） -->
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <script src="theme.js"></script>
  <style>
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f5f7; --text: #18191c; --muted: #61666d; --border: #e3e5e7; --control-bg: #fff; --raised: #fff;
      --accent: #fb7299; --accent-text: #fff; --hover-bg: #ffecf1; --danger: #d93025;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141416; --text: #eaeaea; --muted: #a3a3aa; --border: rgba(128, 128, 128, .4); --control-bg: rgba(255, 255, 255, .04); --raised: #232326;
      --accent: #00a1d6; --accent-text: #fff; --hover-bg: rgba(0, 161, 214, .12); --danger: #ff6b6b;
    }
    html, body { margin: 0; }
    body {
      font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft JhengHei", "Microsoft YaHei", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
      color: var(--text); background: var(--bg); min-height: 100vh;
    }
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--raised); border-bottom: 3px solid #fb7299; }
    .top img { width: 34px; height: 34px; flex: none; }
    .top b { display: block; font-size: 16px; line-height: 1.25; }
    .top small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
    main { max-width: 400px; margin: 0 auto; padding: 28px 16px 40px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .lead { color: var(--muted); margin: 0 0 18px; }
    .lead:empty { display: none; }
    .bbcCard { max-width: none; box-shadow: none; border: 1px solid var(--border); }
    .authBack { margin-top: 6px; padding: 8px 22px; border: 1px solid var(--border); border-radius: 8px; background: var(--control-bg); color: inherit; font: inherit; font-weight: 600; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s; }
    .authBack:hover { border-color: var(--accent); background: var(--hover-bg); color: var(--accent); }
  </style>
</head>

<body>
  <header class="top">
    <img src="logo128.png" alt="" />
    <div><b id="brand"></b><small id="tagline"></small></div>
  </header>
  <main>
    <h1 id="authHead"></h1>
    <p class="lead" id="authLead"></p>
    <div id="authPanel"></div>
  </main>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="cloud.js"></script>
  <script src="cloud-ui.js"></script>
  <script src="auth.js"></script>
</body>

</html>
