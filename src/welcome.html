<!DOCTYPE html>
<!-- 歡迎頁：全新安裝時 background 一律開成小視窗（跟問題回報一樣）。
     版面跟測速工具（CDNSpeedTest.exe）同一套：白色頁首（圖示＋名稱）、粉紅分隔線、灰底白卡片。
     上面是開場動畫（welcome-hero.js）、大大的歡迎詞與主要賣點；中間是雲端備份面板（功能開關 cloud_sync 開著、而且可以用時才有；
     cloud-ui.js 的 mount，fresh 模式；開著但不能用（例如付費限定）時照樣顯示，按鈕畫鎖頭）；最下面是主按鈕「開始使用」（關掉視窗、打開擴充的 popup 一次）。
     登入後在問要不要恢復時，「開始使用」換成灰色的「跳過，開始使用」。
     登入後回到這頁時不再顯示歡迎的部分，只留雲端備份（要不要從雲端恢復）與「開始使用」 -->
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <script src="theme.js"></script>
  <style>
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f5f7; --text: #18191c; --muted: #61666d; --border: #e3e5e7; --control-bg: #fff; --raised: #fff;
      --accent: #fb7299; --accent-hover: #e85c86; --accent-text: #fff; --hover-bg: #ffecf1; --danger: #d93025; --link: #00aeec;
      --gray-btn: #e3e5e7; --gray-btn-hover: #d5d8dc;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141416; --text: #eaeaea; --muted: #a3a3aa; --border: rgba(128, 128, 128, .4); --control-bg: rgba(255, 255, 255, .04); --raised: #232326;
      --accent: #00a1d6; --accent-hover: #0090c0; --accent-text: #fff; --hover-bg: rgba(0, 161, 214, .12); --danger: #ff6b6b; --link: #00a1d6;
      --gray-btn: rgba(255, 255, 255, .1); --gray-btn-hover: rgba(255, 255, 255, .16);
    }
    html, body { margin: 0; }
    body {
      font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft JhengHei", "Microsoft YaHei", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
      color: var(--text); background: var(--bg); min-height: 100vh;
    }
    :lang(ja) { word-break: auto-phrase; line-break: strict; }
    :lang(ko) { word-break: keep-all; overflow-wrap: anywhere; }
    /* 頁首：跟測速工具一樣，白底、左邊圖示＋名稱＋副標，底下一條粉紅線 */
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--raised); border-bottom: 3px solid #fb7299; }
    .top img { width: 34px; height: 34px; flex: none; }
    .top b { display: block; font-size: 16px; line-height: 1.25; }
    .top small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
    main { max-width: 440px; margin: 0 auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; }
    .hero { padding: 8px 20px 22px; text-align: center; } /* 不裁切：跳起來時彩帶會飛出卡片一點 */
    .hero .wh { width: 192px; height: 144px; }
    h1 { font-size: 28px; line-height: 1.3; margin: 4px 0 8px; text-wrap: balance; animation: rise .5s .45s both; }
    .lead { font-size: 17px; line-height: 1.65; color: var(--text); opacity: .82; margin: 0 auto; max-width: 380px; animation: rise .5s .6s both; }
    .lead span { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { h1, .lead, .cloud, .start { animation: none; } }
    .cloud { animation: rise .45s .8s both; }
    .cloud .bbcCard { max-width: none; box-shadow: none; border: 1px solid var(--border); }
    /* 主按鈕「開始使用」 */
    .start {
      width: 100%; padding: 13px 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text);
      font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: background-color .15s; animation: rise .45s .9s both;
    }
    .start:hover, .start:focus-visible { background: var(--accent-hover); outline: none; }
    .start:disabled { opacity: .6; cursor: default; }
    /* 登入後在問要不要從雲端恢復時：「跳過，開始使用」是灰色的次按鈕（主色留給「從雲端恢復」） */
    .start.skip { background: var(--gray-btn); color: var(--text); }
    .start.skip:hover, .start.skip:focus-visible { background: var(--gray-btn-hover); }
  </style>
</head>

<body>
  <header class="top">
    <img src="logo128.png" alt="" />
    <div><b id="brand"></b><small id="tagline"></small></div>
  </header>
  <main>
    <section class="card hero" id="welcomeHero">
      <div id="hero"></div>
      <h1 id="welcomeTitle"></h1>
      <p class="lead" id="welcomeBody"></p>
    </section>
    <div class="cloud" id="cloudPanel" hidden></div>
    <button type="button" class="start" id="startBtn"></button>
  </main>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="features.js"></script>
  <script src="cloud.js"></script>
  <script src="cloud-ui.js"></script>
  <script src="welcome-hero.js"></script>
  <script src="welcome.js"></script>
</body>

</html>
