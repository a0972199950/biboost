# 問題回報收件端（Cloudflare Worker）。部署：npm run worker:deploy（需先 npx wrangler login）
# secrets（npx wrangler secret put <NAME> --config tools/report-worker/wrangler.toml）：
#   GITHUB_TOKEN  fine-grained PAT：LOGS_REPO 的 Contents 讀寫 + ISSUES_REPO 的 Issues 讀寫
#   REPORT_TOKEN  與 src/report.js 的 REPORT_TOKEN 相同的固定字串（弱驗證，擋無差別掃描）
#   MAIL_URL      Apps Script「回報表單同步 issue」專案 Mailer.gs web app 的 /exec 網址（由作者 Gmail 寄確認信）
#   MAIL_SECRET   與該 Apps Script 內 SECRET 相同的字串
#   DATABASE_URL  Neon 的 Postgres 連線字串（同 .env.local），GET /v1/lotteries 讀抽獎、贊助排行榜用
#   ECPAY_MERCHANT_ID、ECPAY_HASH_KEY、ECPAY_HASH_IV  贊助結帳：新台幣（綠界；測試環境在 [vars] 加 ECPAY_STAGE = "1"）
#   STRIPE_SECRET_KEY、STRIPE_WEBHOOK_SECRET  贊助結帳：其他幣別（Stripe）與 webhook（src/donate.js；沒設的那邊結帳回 503）
#   CF_ACCOUNT_ID、CF_ANALYTICS_TOKEN  每日 Cron 讀 Analytics Engine 用（Account Analytics: Read；同 .env.local 的 BCS_CF_ACCOUNT_ID、BCS_CF_ANALYTICS_TOKEN）。只有正式環境要設
name = "bcs-report"
main = "src/index.js"
compatibility_date = "2026-01-01"
# workers.dev 網址不能關：2.8.0（含）以前的擴充（公告、問題回報）與改網址前打包的 CDN 測速工具 exe（抽獎）都寫死這個網址。
# 正式網域另外掛 api.biboost.app（同一份程式；部署時 Cloudflare 自動建 DNS 與憑證），之後的擴充與 exe 全部用這個
workers_dev = true
routes = [
  { pattern = "api.biboost.app", custom_domain = true }
]

[vars]
LOGS_REPO = "a0972199950/bilibili-cdn-switcher-reports"
ISSUES_REPO = "a0972199950/biboost"
# 讀 KV 的 snap:<名稱>:prod（src/snapshots.js）。一定要明確設，沒設或打錯 worker 會回錯誤，不會猜
SNAPSHOT_ENV = "prod"
# 匿名統計的 Analytics Engine dataset（每日 Cron 彙總時查詢用，要跟下面 TELEMETRY 綁定的 dataset 一樣）
TELEMETRY_DATASET = "bb_telemetry"

# 每天一次：把前天、昨天（UTC）的匿名統計從 Analytics Engine 彙總回 Neon（src/telemetry.js；覆蓋寫入，重跑不會重複算）。
# 時間是 UTC：00:20 UTC ＝ 台灣／新加坡 08:20。只有正式環境有，測試環境不排程（不要定時叫醒 staging 的資料庫）
[triggers]
crons = ["20 0 * * *"]

# 公告 API 的下載次數（國家 × 瀏覽器 × 路徑，不記 IP）；查詢：npm run worker:opens
[[analytics_engine_datasets]]
binding = "OPENS"
dataset = "bcs_announce_opens"

# 播放心跳、遇到地區限定、問卷觸發機會（src/telemetry.js）：只寫這裡，不碰 Neon；每天由 Cron 彙總回 Neon
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "bb_telemetry"

# RATE_KV：問題回報限流、贊助結帳限流，以及給擴充讀的快照（snap:<名稱>:prod｜staging，見 src/snapshots.js）。
# 正式與測試環境共用同一個 namespace，快照的 key 依 SNAPSHOT_ENV 分開
[[kv_namespaces]]
binding = "RATE_KV"
id = "e6adf184d971421581d54c062d13a55a"

# 問卷與匿名統計的限流（src/surveys.js）：依 IP、計數在記憶體、不存 IP。period 只能是 10 或 60 秒
#   SURVEY_RL：所有寫入（作答、事件、統計）每個 IP 每分鐘 60 次；SURVEY_DONE_RL：送出完成每個 IP 每分鐘 3 份
[[ratelimits]]
name = "SURVEY_RL"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SURVEY_DONE_RL"
namespace_id = "1102"
simple = { limit = 3, period = 60 }

# 測試環境 api-staging.biboost.app（npm run worker:deploy:staging）：贊助接 Stripe 沙盒、Neon 的 staging 分支，
# 本機載入的開發版擴充用它（src/donate.js），正式的 api.biboost.app 用正式金鑰。secrets 另外設（--env staging）：
#   DATABASE_URL（Neon staging 分支）、STRIPE_SECRET_KEY（沙盒）、STRIPE_WEBHOOK_SECRET（沙盒指到 api-staging 的 webhook）
[env.staging]
name = "bcs-report-staging"
workers_dev = false
routes = [
  { pattern = "api-staging.biboost.app", custom_domain = true }
]

[env.staging.vars]
LOGS_REPO = "a0972199950/bilibili-cdn-switcher-reports"
ISSUES_REPO = "a0972199950/biboost"
# 問卷與統計收所有擴充的 Origin（開發版「載入未封裝」的擴充 id 不固定）；正式環境只收商店版
SURVEY_ANY_EXTENSION = "1"
# 讀 KV 的 snap:<名稱>:staging（後台在測試環境存檔時寫的那份）
SNAPSHOT_ENV = "staging"
TELEMETRY_DATASET = "bb_telemetry_staging"

# 測試環境不排程（triggers 會從上面繼承，這裡明確清空）
[env.staging.triggers]
crons = []

[[env.staging.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "bb_telemetry_staging"

# 測試環境的公告下載次數另外記，不混進正式的統計
[[env.staging.analytics_engine_datasets]]
binding = "OPENS"
dataset = "bcs_announce_opens_staging"

[[env.staging.kv_namespaces]]
binding = "RATE_KV"
id = "e6adf184d971421581d54c062d13a55a"

[[env.staging.ratelimits]]
name = "SURVEY_RL"
namespace_id = "1201"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "SURVEY_DONE_RL"
namespace_id = "1202"
simple = { limit = 3, period = 60 }
